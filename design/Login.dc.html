.u .av{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--primary-text)}
.u b{font-size:13.5px}
.u small{font-size:11.5px;color:var(--muted)}
.pw{position:relative}
.pw .inp{padding-inline-end:44px}
.pw button{position:absolute;inset-inline-end:4px;top:4px;width:34px;height:34px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:8px}
.pw button .i{width:18px;height:18px}
.err{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--danger-soft);color:var(--danger);font-size:13.5px}
.capsw{color:var(--warn);font-size:12.5px}
.lg-foot{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--border);padding-top:12px}
</style>
</helmet>
<div class="mv {{themeCls}}" dir="rtl" lang="ar">
<div class="lg-wrap">
  <div class="lg" role="form" aria-label="تسجيل الدخول">
    <div class="lg-head">
      <div class="logo" aria-hidden="true">م</div>
      <b>[اسم المحل]</b>
      <span>اختر المستخدم وأدخل كلمة المرور</span>
    </div>
    <div class="field">
      <span class="lab" id="ulab">المستخدم</span>
      <div class="dd">
        <button class="{{ddCls}}" onClick="{{toggleDd}}" aria-haspopup="listbox" aria-expanded="{{ddOpen}}" aria-labelledby="ulab">
          <span class="dd-ic" style="font-weight: 700">{{curI}}</span>
          <span class="dd-txt"><b>{{curName}}</b><small>{{curRole}}</small></span>
          <svg class="i caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
        </button>
        <sc-if value="{{ddOpen}}" hint-placeholder-val="{{false}}">
          <div class="ddm" role="listbox" aria-labelledby="ulab">
            <sc-for list="{{users}}" as="u" hint-placeholder-count="3">
              <button class="{{u.cls}}" role="option" aria-selected="{{u.on}}" onClick="{{u.pick}}">
                <span class="dd-ic" style="font-weight: 700">{{u.i}}</span>
                <span class="dd-txt"><b>{{u.n}}</b><small>{{u.r}}</small></span>
                <sc-if value="{{u.on}}" hint-placeholder-val="{{false}}"><svg class="i tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></sc-if>
              </button>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </div>
    <div class="field">
      <label class="lab" for="lpw">كلمة المرور</label>
      <div class="pw">
        <input id="lpw" class="inp ltr" type="{{pwType}}" value="{{pw}}" onChange="{{onPw}}" onKeyDown="{{onKey}}" disabled="{{locked}}" autocomplete="current-password">
        <button onClick="{{toggleShow}}" aria-label="{{showLbl}}" title="{{showLbl}}"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </div>
      <sc-if value="{{caps}}" hint-placeholder-val="{{false}}"><span class="capsw">زر الحروف الكبيرة (Caps Lock) مفعّل</span></sc-if>
    </div>
    <sc-if value="{{hasErr}}" hint-placeholder-val="{{false}}"><div class="err" role="alert">{{errMsg}}</div></sc-if>
    <sc-if value="{{ok}}" hint-placeholder-val="{{false}}"><div class="err" style="background: var(--success-soft); color: var(--success)" role="status">مرحبًا {{curName}} — جارٍ فتح لوحة التحكم…</div></sc-if>
    <button class="btn primary big" onClick="{{login}}" disabled="{{locked}}">دخول</button>
    <div class="lg-foot"><span>آخر نسخة احتياطية: اليوم 08:00</span><span>v1.0.0</span></div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
var US=[{k:'admin',n:'مدير النظام',r:'مدير',pw:'Morv2026!'},{k:'c1',n:'كريم',r:'كاشير',pw:'1234abcd'},{k:'s1',n:'سامي',r:'أمين مخزن',pw:'store2026'}];
class Component extends DCLogic {
  state = {dark:false,dd:false,u:'c1',pw:'',show:false,fails:0,ok:false,err:'',caps:false};
  renderVals() {
    var self=this,s=this.state;var set=function(o){self.setState(o);};
    var U=US.filter(function(x){return x.k===s.u;})[0];
    var locked=s.fails>=5;
    var login=function(){if(locked)return;if(s.pw===U.pw){set({ok:true,err:'',fails:0});return;}
      var f=s.fails+1;set({fails:f,ok:false,pw:'',err:f>=5?'تم إيقاف الدخول 5 دقائق بعد 5 محاولات خاطئة. يُسجَّل ذلك في سجل العمليات.':('كلمة المرور غير صحيحة. المحاولات المتبقية: '+(5-f))});};
    return {
      themeCls:s.dark?'dark':'',
      users:US.map(function(x){return {n:x.n,r:x.r,i:x.n.charAt(0),on:s.u===x.k,cls:s.u===x.k?'dd-opt sel':'dd-opt',pick:function(){set({u:x.k,dd:false,pw:'',err:'',ok:false});}};}),
      pw:s.pw,onPw:function(ev){set({pw:ev.target.value,err:''});},onKey:function(ev){set({caps:!!(ev.getModifierState&&ev.getModifierState('CapsLock'))});if(ev.key==='Enter')login();},
      pwType:s.show?'text':'password',toggleShow:function(){set({show:!s.show});},showLbl:s.show?'إخفاء كلمة المرور':'إظهار كلمة المرور',
      ddOpen:s.dd,ddCls:s.dd?'dd-btn open':'dd-btn',toggleDd:function(){set({dd:!s.dd});},curI:U.n.charAt(0),curRole:U.r,
      caps:s.caps,hasErr:!!s.err,errMsg:s.err,ok:s.ok,curName:U.n,locked:locked,login:login
    };
  }
}
</script>
</body>
</html>
