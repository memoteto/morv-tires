name: Prune CI image branches

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview deletion without changing branches
        type: boolean
        default: true

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: prune-ci-image-branches
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prune verified image branches older than 30 days
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: python tools/prune_ci_images.py
