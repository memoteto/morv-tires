# تشخيص مؤقت: رمز خروج 1 على Windows بعد نجاح الاختبارات (فرع pos-unified-design).
name: diag
on:
  push:
    branches: ["diag/*"]
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        variant: [pos]
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MORV_REQUIRE_QT: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements.txt
      - name: run
        shell: bash
        run: |
          set +e
          export MORV_DATA_DIR="$RUNNER_TEMP/morv_data"
          cat > "$RUNNER_TEMP/r.py" <<'PY'
          import os, sys, tempfile, faulthandler
          faulthandler.enable()
          sys.path.insert(0, os.getcwd())
          from pathlib import Path
          v = sys.argv[1]
          tmp = Path(tempfile.mkdtemp()); os.environ["MORV_DATA_DIR"] = str(tmp)
          from tests.qt_app import get_app
          app = get_app()
          from morv.infra import users
          from morv.infra.db.bootstrap import open_main_db
          from morv.ui.session import Session
          from morv.ui import theme
          con = open_main_db(tmp / "m.db")
          u = users.create_user(con, None, "admin", "x", "Admin12345", "manager")
          import morv.ui.pos_page as pp
          from PySide6.QtWidgets import QWidget
          if v.endswith("_noact"):
              pp.QLineEdit.addAction = lambda *a, **k: None
              v0 = v[:-6]
          else:
              v0 = v
          def part(sec):
              o = pp.PosPage.__new__(pp.PosPage)
              QWidget.__init__(o)
              o.session = Session(con, u); o.lines = []; o._names = []; o._meta = []; o.tier = "retail"; o._kind = None
              lay = pp.QVBoxLayout(o)
              if sec in ("summary", "payment"):
                  lay.addWidget(o._summary_card())
              if sec == "invoice":
                  o.tier_chip = pp.QLabel(); lay.addWidget(o._invoice_card())
              if sec == "items":
                  lay.addWidget(o._items_card())
              if sec == "payment":
                  lay.addWidget(o._payment_card())
              if sec == "header":
                  lay.addWidget(o._build_header()); lay.addLayout(o._build_hints())
              return o
          pages = [part(v0) for _ in range(3)] if v0 != "baseline" else [pp.PosPage(Session(con, u)) for _ in range(3)]
          if v == "destroy":
              for p in pages: p.deleteLater()
          from PySide6.QtCore import QEvent
          app.sendPostedEvents(None, QEvent.Type.DeferredDelete); app.processEvents()
          if True:
              theme.apply(app, True); app.processEvents()
          con.close()
          print("BUILT", v, flush=True)
          os._exit(0)
          PY
          for v in baseline baseline_noact invoice_noact items_noact; do
            n=0; for i in 1 2 3 4 5 6 7 8; do python "$RUNNER_TEMP/r.py" $v > out.txt 2>&1 || n=$((n+1)); done
            echo "RESULT $v crashes=$n/8"; tail -3 out.txt
          done
