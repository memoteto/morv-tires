# تشخيص فشل pytest عند الخروج (docs/known-issues.md): كل ملف واجهة وحده 8 مرات، وصيغة بلا atexit.
# لا يخفي أي فشل: المهمة تفشل إن فشل أي تشغيل. يعمل على فروع diag/** فقط ولا يمس ci.yml.
name: diag-pytest-exit

on:
  push:
    branches: ["diag/**"]

jobs:
  repeat:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        variant: [ui-phase1, ui-phase2, ui-shell, theme, all-ui-no-atexit]
        include:
          - {variant: ui-phase1, args: "tests/test_ui_phase1.py"}
          - {variant: ui-phase2, args: "tests/test_ui_phase2.py"}
          - {variant: ui-shell, args: "tests/test_ui_shell.py"}
          - {variant: theme, args: "tests/test_theme.py"}
          - {variant: all-ui-no-atexit, args: "tests/test_ui_phase1.py tests/test_ui_phase2.py tests/test_ui_shell.py tests/test_theme.py"}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      MORV_REQUIRE_QT: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: مكتبات Qt على Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-noto-core
      - name: تثبيت المتطلبات
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: مجلد بيانات مؤقت
        shell: bash
        run: echo "MORV_DATA_DIR=${RUNNER_TEMP}/morv_data" >> "$GITHUB_ENV"
      - name: إصدارات Qt المثبتة
        shell: bash
        run: python -m pip list 2>/dev/null | grep -i -E "pyside|shiboken|pytest" || true
      - name: تعطيل خطّاف atexit في نسخة CI فقط (صيغة تشخيص لا إصلاح)
        if: matrix.variant == 'all-ui-no-atexit'
        shell: bash
        run: |
          python - <<'PY'
          p = "tests/qt_app.py"
          s = open(p, encoding="utf-8").read()
          assert "atexit.register(_shutdown)" in s
          open(p, "w", encoding="utf-8").write(s.replace("atexit.register(_shutdown)", "pass"))
          PY
          git diff --stat
      - name: تكرار pytest مع تسجيل رمز الخروج
        shell: bash
        run: |
          fails=0
          for i in 1 2 3 4 5 6 7 8; do
            rc=0
            python -X faulthandler -m pytest -q -p no:cacheprovider ${{ matrix.args }} > "out_$i.txt" 2>&1 || rc=$?
            tail -n 4 "out_$i.txt"
            echo "ITER $i os=${{ matrix.os }} variant=${{ matrix.variant }} exit=$rc"
            if [ "$rc" -ne 0 ]; then fails=$((fails+1)); fi
          done
          echo "FAILED_ITERATIONS=$fails of 8"
          exit "$fails"
