# فحص آلي عند كل دفع أو طلب دمج: الاختبارات على Linux و Windows، ثم بناء MorvTires.exe وتشغيله.
name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

jobs:
  lint:
    # فحص Ruff فقط: يفشل عند أي خطأ، ولا يصلح الملفات تلقائيًا
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: تثبيت أدوات التطوير
        run: python -m pip install -r requirements-dev.txt
      - name: فحص Ruff
        run: ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write        # the Windows run pushes its printed samples to their own branch
    env:
      QT_QPA_PLATFORM: offscreen
      MORV_REQUIRE_QT: "1"          # اختبارات الواجهة تفشل ولا تُتخطى إن غابت Qt
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: مكتبات Qt على Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-noto-core
      - name: تثبيت المتطلبات
        run: python -m pip install -r requirements.txt
      - name: مجلد بيانات مؤقت
        shell: bash
        run: echo "MORV_DATA_DIR=${RUNNER_TEMP}/morv_data" >> "$GITHUB_ENV"
      - name: الاختبارات
        run: python run_tests.py
      # pytest كان يعيد تشغيل المجموعة نفسها كاملة (نفس المعرّفات بالضبط)؛ صار يتحقق من التطابق فقط
      - name: تطابق اكتشاف الاختبارات بين unittest و pytest
        run: |
          python -m pip install -r requirements-dev.txt
          python tools/check_test_discovery.py
      # الورق يُرسم على ويندوز بخطوط ومحرك مختلفين؛ هذه النماذج هي الطريقة الوحيدة لرؤيته
      - name: نماذج المستندات المطبوعة على ويندوز
        if: runner.os == 'Windows'
        run: python tools/print_samples.py print_win
      - name: رفع نماذج ويندوز إلى فرع معزول للمراجعة
        if: runner.os == 'Windows' && always()
        shell: bash
        run: |
          cd print_win
          git init -q -b print-images-win
          git config user.name "print-samples"
          git config user.email "print-samples@users.noreply.github.com"
          git add -A
          git commit -q -m "windows print samples from ${{ github.head_ref || github.ref_name }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" print-images-win

  build-windows:
    needs: test
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: تثبيت المتطلبات
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: بناء MorvTires.exe
        run: python tools/build_exe.py
      - name: قائمة المكونات (SBOM) داخل الحزمة
        shell: pwsh
        run: |
          python --version | Out-File -FilePath dist\MorvTires\SBOM.txt -Encoding utf8
          python -m pip freeze --exclude-editable | Out-File -FilePath dist\MorvTires\SBOM.txt -Append -Encoding utf8
          Get-Content dist\MorvTires\SBOM.txt
      - name: تشغيل النسخة المبنية (فحص ذاتي)
        shell: pwsh
        run: |
          $env:MORV_DATA_DIR = "$env:RUNNER_TEMP\morv_smoke"
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\MorvTires\MorvTires.exe" -ArgumentList "--selfcheck" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "البرنامج لم يُغلق خلال 60 ثانية" }
          if ($p.ExitCode -ne 0) { throw "البرنامج خرج برمز $($p.ExitCode) (انهيار عند الإغلاق؟)" }
          $f = "$env:MORV_DATA_DIR\startup.txt"
          if (-not (Test-Path $f)) { throw "startup.txt غير موجود" }
          Get-Content $f
          if (-not ((Get-Content $f) -match '^ok')) { throw "النتيجة ليست ok" }
          if (-not (Test-Path "$env:MORV_DATA_DIR\morv_tires.db")) { throw "قاعدة البيانات لم تُنشأ" }
      - name: النسخة الموزّعة لا تُنشئ حسابًا ثابتًا
        shell: pwsh
        run: |
          $env:MORV_DATA_DIR = "$env:RUNNER_TEMP\morv_smoke"
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\MorvTires\MorvTires.exe" -ArgumentList "--smoke" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "البرنامج لم يُغلق خلال 60 ثانية" }
          if ($p.ExitCode -ne 2) { throw "كان يجب رفض --smoke برمز 2، وخرج برمز $($p.ExitCode)" }
          python -c "import os, sqlite3, sys; c = sqlite3.connect(os.path.join(os.environ['MORV_DATA_DIR'], 'morv_tires.db')); n = c.execute('select count(*) from users').fetchone()[0]; sys.exit(0 if n == 0 else 1)"
          if ($LASTEXITCODE -ne 0) { throw "النسخة الموزّعة أنشأت مستخدمًا" }
      - name: بصمة الحزمة وإصدارها
        shell: pwsh
        run: |
          $v = python -c "import morv; print(morv.VERSION)"
          "MorvTires $v" | Out-File -FilePath dist\MorvTires\RELEASE.txt -Encoding utf8
          "commit: $env:GITHUB_SHA" | Out-File -FilePath dist\MorvTires\RELEASE.txt -Append -Encoding utf8
          Get-FileHash dist\MorvTires\MorvTires.exe -Algorithm SHA256 |
            ForEach-Object { "sha256: $($_.Hash)" } |
            Out-File -FilePath dist\MorvTires\RELEASE.txt -Append -Encoding utf8
          Get-Content dist\MorvTires\RELEASE.txt
      - name: بناء المثبِّت
        shell: pwsh
        run: |
          $v = python -c "import morv; print(morv.VERSION)"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "تعذّر تجهيز Inno Setup على المشغّل" }
          & $iscc "/DAppVersion=$v" tools\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "فشل بناء المثبِّت" }
          $setup = Get-ChildItem dist\MorvTires-Setup-*.exe | Select-Object -First 1
          Get-FileHash $setup.FullName -Algorithm SHA256 |
            ForEach-Object { "setup sha256: $($_.Hash)" } |
            Out-File -FilePath dist\MorvTires\RELEASE.txt -Append -Encoding utf8
          Get-Content dist\MorvTires\RELEASE.txt
      - name: رفع المثبِّت
        uses: actions/upload-artifact@v4
        with:
          name: MorvTires-Setup-${{ github.run_number }}
          path: dist/MorvTires-Setup-*.exe
          retention-days: 14
      - name: اسم الأرتيفكت الآمن
        id: art
        shell: pwsh
        # اسم الفرع يحمل "/" في تشغيلات الدمج (3/merge) فيرفضه الرفع؛ نستبدلها بـ "-"
        run: |
          $safe = $env:GITHUB_REF_NAME -replace '/', '-'
          "name=MorvTires-$safe-$env:GITHUB_RUN_NUMBER" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.art.outputs.name }}
          path: dist/MorvTires
          retention-days: 14

  ui-audit:
    permissions:
      contents: write
    # لقطات الصفحات والنوافذ على Windows بدقتين وبالوضعين، وتقرير قياس (معلوماتي، لا يفشل على الملاحظات)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: تثبيت المتطلبات
        run: python -m pip install -r requirements.txt
      - name: لقطات وقياسات الواجهة
        run: python tools/ui_audit.py ui_audit_out
      - name: نماذج المستندات المطبوعة
        run: python tools/print_samples.py ui_audit_out/print
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-audit
          path: ui_audit_out
      - name: رفع الصور إلى فرع معزول للمراجعة (مؤقت)
        if: always()
        shell: bash
        run: |
          cd ui_audit_out
          git init -q -b ui-audit-images
          git config user.name "ui-audit"
          git config user.email "ui-audit@users.noreply.github.com"
          git add -A
          git commit -q -m "ui audit images from ${{ github.head_ref || github.ref_name }} @ ${{ github.event.pull_request.head.sha || github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ui-audit-images

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: تثبيت ما يُشحن مع البرنامج
        run: python -m pip install -r requirements.txt
      - name: قائمة المكونات (SBOM)
        run: |
          python --version | tee sbom.txt
          python -m pip freeze --exclude-editable | tee -a sbom.txt
      # أداة الفحص نفسها لا تُشحن، فلا تُثبَّت على إصدار؛ إصدارها يُسجَّل في السجل
      # لقبول ثغرة بقرار موثّق: أضف --ignore-vuln <المعرّف> هنا مع تعليق يذكر السبب
      - name: فحص الثغرات المعروفة
        run: |
          python -m pip install pip-audit
          pip-audit --version
          pip-audit --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: sbom.txt
          retention-days: 90
